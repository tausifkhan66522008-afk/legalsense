<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - Legalsense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#475569',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 border-b border-slate-200 shadow-sm bg-white/90 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo -->
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="index.html" class="flex items-center space-x-2">
                            <i data-lucide="scale" class="w-8 h-8 text-primary"></i>
                            <span class="text-xl font-bold tracking-tight text-slate-900">Legalsense</span>
                        </a>
                    </div>
                </div>
                <!-- Nav Links - Simply a 'Back to Home' here -->
                <div class="flex items-center">
                    <a href="index.html" class="text-slate-500 hover:text-slate-700 font-medium text-sm">Cancel</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-md border border-slate-100">
            <div>
                <div class="mx-auto h-12 w-12 text-primary flex items-center justify-center rounded-full bg-blue-100">
                    <i data-lucide="user-plus" class="w-6 h-6"></i>
                </div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900">
                    Get Started
                </h2>
                <p class="mt-2 text-center text-sm text-slate-600">
                    Please provide your details to proceed.
                </p>
            </div>

            <form id="login-form" class="mt-8 space-y-6">
                <div class="rounded-md shadow-sm -space-y-px">
                    <!-- Name -->
                    <div class="mb-4">
                        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Full Name <span
                                class="text-red-500">*</span></label>
                        <input id="name" name="name" type="text" required
                            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                            placeholder="John Doe">
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address <span
                                class="text-red-500">*</span></label>
                        <input id="email" name="email" type="email" autocomplete="email" required
                            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                            placeholder="you@example.com">
                    </div>

                    <!-- Phone -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Phone Number <span
                                class="text-red-500">*</span></label>
                        <input id="phone" name="phone" type="tel" autocomplete="tel" required
                            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-primary focus:border-primary focus:z-10 sm:text-sm"
                            placeholder="+91 98765 43210">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i data-lucide="lock" class="h-5 w-5 text-blue-300 group-hover:text-blue-100"></i>
                        </span>
                        Submit & Login
                    </button>
                    <p class="mt-2 text-center text-xs text-slate-400">
                        Information will be sent to admin via Email.
                    </p>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-base text-slate-400">
                &copy; 2024 Legalsense. Educational purpose only.
            </p>
        </div>
    </footer>

    <script src="assets/js/login.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
