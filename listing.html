<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Sections - Legalsense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#475569',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 border-b border-slate-200 shadow-sm bg-white/90 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="index.html" class="flex items-center space-x-2">
                            <i data-lucide="scale" class="w-8 h-8 text-primary"></i>
                            <span class="text-xl font-bold tracking-tight text-slate-900">Legalsense</span>
                        </a>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="index.html"
                            class="border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Home
                        </a>
                        <a href="listing.html"
                            class="border-primary text-slate-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            All Sections
                        </a>
                        <a href="disclaimer.html"
                            class="border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Disclaimer
                        </a>
                    </div>
                </div>
                <!-- Desktop Login Button -->
                <div class="hidden sm:ml-6 sm:flex sm:items-center">
                    <button id="lang-toggle"
                        class="mr-4 text-sm font-medium text-slate-500 hover:text-slate-900 focus:outline-none transition-colors">
                        Switch to Hinglish
                    </button>
                    <a href="login.html"
                        class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-full shadow-sm text-white bg-primary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                        Login
                    </a>
                </div>

                <!-- Mobile Menu Button -->
                <div class="flex items-center sm:hidden">
                    <a href="login.html"
                        class="mr-4 inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-full shadow-sm text-white bg-primary hover:bg-blue-700">
                        Login
                    </a>
                    <button id="mobile-menu-btn" type="button"
                        class="inline-flex items-center justify-center p-2 rounded-md text-slate-400 hover:text-slate-500 hover:bg-slate-100">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div class="sm:hidden hidden bg-white border-b border-slate-200" id="mobile-menu">
            <div class="pt-2 pb-3 space-y-1">
                <a href="index.html"
                    class="border-transparent text-slate-500 hover:bg-slate-50 hover:border-slate-300 hover:text-slate-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Home</a>
                <a href="listing.html"
                    class="bg-primary/10 border-l-4 border-primary text-primary block pl-3 pr-4 py-2 text-base font-medium">All
                    Sections</a>
                <a href="disclaimer.html"
                    class="border-transparent text-slate-500 hover:bg-slate-50 hover:border-slate-300 hover:text-slate-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Disclaimer</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <div class="md:flex md:items-center md:justify-between mb-8">
            <div class="flex-1 min-w-0">
                <h2 class="text-2xl font-bold leading-7 text-slate-900 sm:text-3xl sm:truncate">
                    IPC Sections Library
                </h2>
                <p class="mt-1 text-sm text-slate-500" id="result-count">
                    Loading...
                </p>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-100 mb-8">
            <div class="grid grid-cols-1 gap-y-4 gap-x-4 sm:grid-cols-6">
                <div class="sm:col-span-4">
                    <label for="listing-search" class="block text-sm font-medium text-slate-700">Search</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="search" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input type="text" name="listing-search" id="listing-search"
                            class="focus:ring-primary focus:border-primary block w-full pl-10 sm:text-sm border-slate-300 rounded-md py-2"
                            placeholder="Search by section number, title, or keyword">
                    </div>
                </div>

                <div class="sm:col-span-2">
                    <label for="category-filter" class="block text-sm font-medium text-slate-700">Filter by
                        Category</label>
                    <select id="category-filter" name="category-filter"
                        class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-slate-300 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm rounded-md">
                        <option value="">All Categories</option>
                        <!-- JavaScript will populate categories -->
                    </select>
                </div>
            </div>
        </div>

        <!-- Listing Grid -->
        <div id="ipc-listing-container" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <!-- Cards will be injected here -->
        </div>

        <!-- Pagination -->
        <div id="pagination" class="mt-8 flex items-center justify-between border-t border-slate-200 px-4 py-3 sm:px-6">
            <!-- JS will populate -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-base text-slate-400">
                &copy; 2024 Legalsense. Educational purpose only. Not legal advice.
            </p>
        </div>
    </footer>

    <!-- Data and App Logic -->
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/listing.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
